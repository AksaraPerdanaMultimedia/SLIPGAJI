name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan situs
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        run: |
          mkdir _site
          sed "s#__API_URL__#${WEBAPP_URL}#" src/index.html > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
